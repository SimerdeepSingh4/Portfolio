<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- Primary Meta Tags for a Digital Business Card -->
    <title>Simerdeep Singh - Full-Stack Developer Portfolio</title>
    <meta name="title" content="Simerdeep Singh - Full-Stack Developer Portfolio">
    <meta name="description" content="The portfolio of Simerdeep Singh, a full-stack developer specializing in React, Node.js, and modern web technologies. Explore my projects and skills.">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://simerdeep-portfolio.vercel.app/">
    <meta property="og:title" content="Simerdeep Singh - Full-Stack Developer Portfolio">
    <meta property="og:description" content="Explore the projects and skills of Simerdeep Singh, a developer specializing in the MERN stack, AI integration, and modern web applications.">
    <meta property="og:image" content="https://simerdeep-portfolio.vercel.app/og-image.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Check for a saved theme in localStorage.
        const theme = localStorage.getItem('theme');
        // If the theme is not 'light', default to dark mode.
        // This makes 'dark' the default for first-time visitors (when theme is null).
        if (theme !== 'light') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
