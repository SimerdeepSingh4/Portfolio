<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="MOE6qUqKiIeVxK8eo9q4b334jLS7CIZz1jYEgE8oFWI" />


    <!-- Primary Meta Tags for a Digital Business Card -->
    <title>Simerdeep Singh Gandhi - Full-Stack Developer Portfolio</title>
    <meta
      name="title"
      content="Simerdeep Singh Gandhi - Full-Stack Developer Portfolio"
    />
    <meta
      name="description"
      content="Portfolio of Simerdeep Singh Gandhi, a full-stack developer specializing in React, Node.js, and modern web technologies. Explore my projects, skills, and AI-integrated web apps."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://simerdeep-portfolio.vercel.app/" />
    <meta
      property="og:title"
      content="Simerdeep Singh Gandhi - Full-Stack Developer Portfolio"
    />
    <meta
      property="og:description"
      content="Explore the work of Simerdeep Singh Gandhi — a full-stack developer experienced in React, Node.js, and AI-driven web applications."
    />
    <meta
      property="og:image"
      content="https://simerdeep-portfolio.vercel.app/og-image.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Simerdeep Singh Gandhi - Full-Stack Developer Portfolio"
    />
    <meta
      name="twitter:description"
      content="Full-stack developer specializing in the MERN stack and AI-based apps. View projects and contact me."
    />
    <meta
      name="twitter:image"
      content="https://simerdeep-portfolio.vercel.app/og-image.png"
    />

    <!-- JSON-LD Schema for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Simerdeep Singh Gandhi",
        "url": "https://simerdeep-portfolio.vercel.app/",
        "jobTitle": "Full-Stack Developer",
        "worksFor": {
          "@type": "Organization",
          "name": "Freelance / Open Source"
        },
        "sameAs": [
          "https://github.com/simerdeepgandhi",
          "https://www.linkedin.com/in/simerdeepgandhi"
        ]
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        // Check for a saved theme in localStorage.
        const theme = localStorage.getItem("theme");
        // If the theme is not 'light', default to dark mode.
        // This makes 'dark' the default for first-time visitors (when theme is null).
        if (theme !== "light") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <!-- Google Fonts: Sora, Space Grotesk, Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
